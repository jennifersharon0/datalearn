# Fichier : pytest.ini
#
# Réglages de pytest, l'outil qui lance les tests automatiques.
# Lancement, depuis la racine du projet :
#     pytest
#
# testpaths : les tests sont rangés dans le dossier tests/.
# pythonpath : la racine du projet est ajoutée aux chemins d'import, pour
#   que les tests puissent écrire "import main" comme le serveur lui-même.
# addopts : -q affiche un résumé court, une ligne par fichier.

[pytest]
testpaths = tests
pythonpath = .
addopts = -q